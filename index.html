<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow - For my glow </title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        .letterbox {
            position: absolute;
            left: 0;
            width: 100%;
            height: 8vh; /* Reduced height for mobile */
            background: #000;
            z-index: 30;
        }
        .top { top: 0; }
        .bottom { bottom: 0; }

        .message-container {
            position: absolute;
            bottom: 18vh;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 600px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        .message {
            color: rgba(255, 235, 190, 0.95);
            font-family: 'Georgia', serif;
            font-style: italic;
            text-align: center;
            /* Optimized font sizing for mobile vs desktop */
            font-size: clamp(0.95rem, 4.5vw, 1.25rem);
            line-height: 1.5;
            letter-spacing: 0.3px;
            text-shadow: 0px 2px 12px rgba(0, 0, 0, 1);
        }

        .switch-container {
            position: absolute;
            bottom: 2vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .switch-label {
            color: #666;
            font-family: monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .toggle {
            appearance: none;
            width: 54px; /* Slightly larger for easier tapping */
            height: 28px;
            background: #222;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            outline: none;
            border: 1px solid #333;
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #555;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle:checked { background: #ffaa33; }
        .toggle:checked::before {
            left: 28px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

    <div class="letterbox top"></div>
    <div id="canvas-container"></div>
    
    <audio id="glowAudio" src="glow.mp3" loop preload="auto"></audio>

    <div class="message-container" id="msg-container">
        <div class="message">
            "I was just thinking about you and realized you’re basically a light bulb for my heart. Every time you're around, my little world lights up and everything feels so warm and cozy. Thanks for being my glow."
        </div>
    </div>

    <div class="letterbox bottom">
        <div class="switch-container">
            <span class="switch-label">Light up</span>
            <input type="checkbox" id="lightToggle" class="toggle">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const isMobile = window.innerWidth < 768;

        const CONFIG = {
            bulbCount: isMobile ? 7 : 10, // Fewer bulbs on mobile for performance
            baseColor: 0xffbb44,
            ceilingHeight: 8,
            bloomStrength: 1.8,
        };

        let isLightsOn = false;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.FogExp2(0x000000, 0.04);

        // Adjust FOV based on screen orientation
        const fov = window.innerWidth < window.innerHeight ? 65 : 45;
        const camera = new THREE.PerspectiveCamera(fov, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1, isMobile ? 15 : 13);

        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile }); // Antialias off on mobile for speed
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0, 0.8, 0.2);
        composer.addPass(bloomPass);

        scene.add(new THREE.AmbientLight(0x404040, 0.1));

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0,
            roughness: 0.05,
            transmission: 0.95,
            thickness: 0.5,
            transparent: true,
            opacity: 0.4,
            emissive: CONFIG.baseColor,
            emissiveIntensity: 0
        });

        class HangingBulb {
            constructor(x, z, wireLength, delay) {
                this.group = new THREE.Group();
                this.group.position.set(x, CONFIG.ceilingHeight, z);
                this.angle = 0;
                this.velocity = 0;
                this.damping = 0.985;
                this.length = wireLength;
                this.phase = delay;

                const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, this.length), new THREE.MeshStandardMaterial({color: 0x0a0a0a}));
                wire.position.y = -this.length/2;
                this.group.add(wire);

                const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.5), new THREE.MeshStandardMaterial({color: 0x1a1a1a}));
                socket.position.y = -this.length;
                this.group.add(socket);

                const bulbGeo = new THREE.SphereGeometry(0.5, 24, 24); 
                this.bulb = new THREE.Mesh(bulbGeo, glassMaterial.clone());
                this.bulb.scale.set(1, 1.3, 1); 
                this.bulb.position.y = -this.length - 0.6;
                this.group.add(this.bulb);

                const filGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.4);
                this.filament = new THREE.Mesh(filGeo, new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0}));
                this.filament.position.y = -this.length - 0.6;
                this.group.add(this.filament);

                this.light = new THREE.PointLight(CONFIG.baseColor, 0, isMobile ? 10 : 15, 1.8);
                this.light.position.y = -this.length - 0.6;
                this.group.add(this.light);

                scene.add(this.group);
            }

            update(time, movementX) {
                const wind = Math.sin(time * 0.0008 + this.phase) * 0.0004;
                this.velocity += (-0.01 * Math.sin(this.angle)) + wind + (movementX * 0.0001);
                this.velocity *= this.damping;
                this.angle += this.velocity;
                this.group.rotation.x = this.angle;
                this.group.rotation.z = this.angle * 0.2;

                if (isLightsOn) {
                    const flicker = 25 + Math.random() * 2;
                    this.light.intensity = THREE.MathUtils.lerp(this.light.intensity, flicker, 0.05);
                    this.bulb.material.emissiveIntensity = THREE.MathUtils.lerp(this.bulb.material.emissiveIntensity, 0.5, 0.05);
                    this.filament.material.opacity = 1;
                } else {
                    this.light.intensity = THREE.MathUtils.lerp(this.light.intensity, 0, 0.1);
                    this.bulb.material.emissiveIntensity = 0;
                    this.filament.material.opacity = 0;
                }
            }
        }

        const bulbs = [];
        const spacing = isMobile ? 1.2 : 1.8;
        const offset = (CONFIG.bulbCount - 1) * spacing / 2;

        for (let i = 0; i < CONFIG.bulbCount; i++) {
            bulbs.push(new HangingBulb((i * spacing) - offset, (Math.random()-0.5)*2, 4.5 + Math.random() * 3, i));
        }

        const toggle = document.getElementById('lightToggle');
        const msg = document.getElementById('msg-container');
        const audio = document.getElementById('glowAudio');
        let audioInterval;

        function fadeAudio(targetVolume, duration) {
            clearInterval(audioInterval);
            const step = 0.05;
            const intervalTime = 50;
            audioInterval = setInterval(() => {
                if (Math.abs(audio.volume - targetVolume) < step) {
                    audio.volume = targetVolume;
                    clearInterval(audioInterval);
                    if (targetVolume === 0) audio.pause();
                } else {
                    audio.volume += (targetVolume > audio.volume) ? step : -step;
                }
            }, intervalTime);
        }

        toggle.addEventListener('change', (e) => {
            isLightsOn = e.target.checked;
            msg.style.opacity = isLightsOn ? "1" : "0";
            bloomPass.strength = isLightsOn ? CONFIG.bloomStrength : 0;

            if (isLightsOn) {
                audio.volume = 0;
                audio.play().catch(() => console.log("User interaction required for audio"));
                fadeAudio(1.0, 2000);
            } else {
                fadeAudio(0, 1000);
            }
        });

        // Combined mouse and touch movement
        let movementX = 0;
        const handleMove = (x) => { movementX = (x - window.innerWidth / 2) / 1000; };
        
        document.addEventListener('mousemove', (e) => handleMove(e.clientX));
        document.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX), { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();
            camera.position.x += (movementX * 3 - camera.position.x) * 0.02;
            camera.lookAt(0, 2, 0);
            bulbs.forEach(b => b.update(time, movementX));
            composer.render();
        }

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.fov = width < height ? 65 : 45;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            composer.setSize(width, height);
        });

        animate();
    </script>
</body>
</html>
